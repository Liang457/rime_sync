<table>
  <thead>
    <tr><th>路径</th><th>版本</th><th>来源</th><th>大小</th><th>SHA3（前 20）</th><th></th></tr>
  </thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td class="mono">{{ r.path }}</td>
      <td class="versions"{% if r.version %} title="{{ r.version }}{% if r.version_note %}（{{ r.version_note }}）{% endif %}"{% endif %}>{% if r.version %}{{ r.version }}{% if r.version_note %}<span class="muted">（{{ r.version_note }}）</span>{% endif %}{% else %}--{% endif %}</td>
      <td><span class="chip b-{{ r.source }}">{{ r.source }}</span></td>
      <td>{{ r.size | human_size }}</td>
      <td class="mono muted">{{ r.sha3 }}</td>
      <td class="actions">
        <a href="/files/download/{{ r.path }}"><md-text-button>下载</md-text-button></a>
        <md-text-button class="error-text danger-action"
                data-post="/files/delete" data-vals='{"path":"{{ r.path }}"}'
                data-remove-row="1"
                data-confirm="删除 {{ r.path }}？（移入回收站，设备下次同步将不再收到）">删除</md-text-button>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="6" class="empty">没有匹配的文件</td></tr>
  {% endfor %}
  </tbody>
</table>
