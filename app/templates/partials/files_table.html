<table>
  <thead>
    <tr><th>路径</th><th>版本</th><th>来源</th><th>大小</th><th>SHA3（前 20）</th><th></th></tr>
  </thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td class="mono">{{ r.path }}</td>
      <td>{{ r.version or '—' }}</td>
      <td><span class="chip b-{{ r.source }}">{{ r.source }}</span></td>
      <td>{{ r.size | human_size }}</td>
      <td class="mono muted">{{ r.sha3 }}</td>
      <td class="actions">
        <a class="btn text small" href="/files/download/{{ r.path }}">下载</a>
        <button class="btn danger small" hx-post="/files/delete" hx-vals='{"path":"{{ r.path }}"}'
                hx-target="closest tr" hx-swap="delete"
                hx-confirm="删除 {{ r.path }}？（移入回收站，设备下次同步将不再收到）">删除</button>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="6" class="empty">没有匹配的文件</td></tr>
  {% endfor %}
  </tbody>
</table>
